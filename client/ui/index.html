<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskHUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="label-texture">

  <div class="center-screen">
    <div class="card">
      <div class="seal">TH</div>
      <h1 class="text-center mb-24" style="font-size: 22px;">TaskHUD</h1>

      <div class="tabs">
        <div class="tab active" id="tab-login" onclick="switchTab('login')">Iniciar sesión</div>
        <div class="tab" id="tab-register" onclick="switchTab('register')">Crear cuenta</div>
      </div>

      <div class="error-msg" id="error-box"></div>

      <!-- Formulario de login -->
      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>

      <!-- Formulario de registro -->
      <form id="form-register" onsubmit="handleRegister(event)" style="display: none;">
        <div class="field">
          <label for="reg-username">Usuario</label>
          <input type="text" id="reg-username" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="reg-password">Contraseña</label>
          <input type="password" id="reg-password" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary">Crear cuenta</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
